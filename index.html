<!DOCTYPE html>
<html>
<head>
    <title>Analytics Demo Landing Page</title>
    <script src="https://cdn.amplitude.com/libs/analytics-browser-2.11.1-min.js.gz"></script>
    <script>
      window.amplitude.init('3712151faabbed74138cffa0f63cc2ad');
    </script>
<style>
    body {
        font-family: Courier, "Courier New", monospace;
        text-align: center;
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(to bottom, orange, yellow);
        
        /* Centers content and provides even spacing */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 30px;
    }

    h1 {
        color: #1f3b57;
        font-size: 36px;
        margin: 0;
    }

    p {
        color: #555;
        font-size: 18px;
        margin: 0;
    }

    button {
        padding: 14px 24px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    #signup-btn {
        background-color: lightblue;
        color: black;
    }

    #demo-btn {
        background-color: lightgreen;
        color: black;
    }

    button:hover {
        opacity: 0.85;
    }

    /* Container for buttons to keep spacing even */
    .button-container {
        display: flex;
        gap: 20px;
    }
</style>
</head>
<body>
    <h1>Analytics Demo Platform</h1>
    <p>Understand customer behavior with powerful analytics.</p>
    <button id="signup-btn">Sign Up</button>
    <button id="demo-btn">Request Demo</button>
    <script>
        document.getElementById("signup-btn").addEventListener("click", function () {
            console.log("Sign Up Clicked");
            if (typeof amplitude !== "undefined") {
                amplitude.track("Sign Up Clicked");
            }
        });
        document.getElementById("demo-btn").addEventListener("click", function () {
            console.log("Request Demo Clicked");
            if (typeof amplitude !== "undefined") {
                amplitude.track("Request Demo Clicked");
            }
        });
    </script>
</body>
</html>
